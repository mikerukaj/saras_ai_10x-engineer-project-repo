name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Debug file structure
        run: |
          echo "=== Root Directory ==="
          ls -la
          echo "=== Looking inside folders ==="
          ls -la b* || echo "No folders starting with b"


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pwd
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Run ruff
        run: ruff check app tests
        working-directory: backend

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests with coverage
        run: >
          pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80
        working-directory: backend

  build:
    name: Build Docker image (backend)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: promptlab-backend:${{ github.sha }}

      # NOTE: no frontend image build here — frontend/ has no Dockerfile
      # yet (tasks.md task T036 is blocked: the frontend/ project itself
      # hasn't been scaffolded, see tasks.md Phase 1-4). Add a frontend
      # build step once frontend/Dockerfile exists.
