server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side (browser history) routing, so any
    # path that doesn't match a real static file must fall back to
    # index.html rather than 404-ing on refresh/deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
