services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # NOTE: no volume is mounted for a SQLite database file here because the
    # SQLModel/SQLite persistence swap (tasks.md Phase 2, T004-T006) has not
    # been implemented yet — the backend still uses in-memory storage, so
    # data does not survive a container restart. Add a named volume once
    # that swap lands.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    # The frontend's API base URL (src/api/client.ts) defaults to
    # http://localhost:8000, which is baked in at build time and resolves
    # correctly here because the browser (not the container) makes the
    # request — it hits the backend's port published on the host above, not
    # a container-network address. No VITE_API_BASE_URL override needed for
    # this default setup.
